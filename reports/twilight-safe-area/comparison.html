<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暮光安全區修正比較 · V3.4.26</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #e8e5dd; color: #27362f; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 900px; margin: auto; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { margin: 0 0 20px; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 28px; }
    figure { margin: 0; }
    figcaption { font-weight: 600; padding: 8px 0; }
    img { display: block; width: 100%; border: 1px solid #ced3c5; }
    h2 { font-size: 20px; margin: 16px 0 0; }
    @media (max-width: 560px) { body { padding: 16px; } .pair { gap: 10px; } figcaption { font-size: 14px; } }
  </style>
</head>
<body><main>
  <h1>暮光風格 · 頂部與紙頁銜接</h1>
  <p>左：修正前，右：V3.4.26。使用相同測試資料配置與隔離存檔，430 × 932，模擬頂部 59px／底部 34px 安全區。圖片不含 iOS 原生狀態列；實機驗收仍待完成。</p>
  <h2>首頁 · 同行夥伴與今日任務</h2>
  <div class="pair"><figure><figcaption>修正前</figcaption><img src="before-home-task.png" alt="修正前首頁，頂部米白留白與兩側圓角缺口"></figure><figure><figcaption>修正後</figcaption><img src="after-home-task.png" alt="修正後首頁，深色頂部與完整米白圓角紙頁"></figure></div>
  <h2>首頁 · 空任務</h2>
  <div class="pair"><figure><figcaption>修正前</figcaption><img src="before-home-empty.png" alt="修正前空任務首頁" loading="lazy"></figure><figure><figcaption>修正後</figcaption><img src="after-home-empty.png" alt="修正後空任務首頁" loading="lazy"></figure></div>
  <h2>設定</h2>
  <div class="pair"><figure><figcaption>修正前</figcaption><img src="before-settings.png" alt="修正前設定頁" loading="lazy"></figure><figure><figcaption>修正後</figcaption><img src="after-settings.png" alt="修正後設定頁" loading="lazy"></figure></div>
  <h2>探險</h2>
  <div class="pair"><figure><figcaption>修正前</figcaption><img src="before-expedition.png" alt="修正前探險頁" loading="lazy"></figure><figure><figcaption>修正後</figcaption><img src="after-expedition.png" alt="修正後探險頁" loading="lazy"></figure></div>
</main></body>
</html>
