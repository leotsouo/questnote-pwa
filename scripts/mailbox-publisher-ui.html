<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuestNote Mailbox Publisher</title>
  <style>
    :root {
      --bg: #0f1424;
      --card: #171e33;
      --text: #eef2ff;
      --muted: #9aa6c5;
      --accent: #8b5cf6;
      --border: rgba(148, 163, 184, 0.28);
      --danger: #fb7185;
      --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: linear-gradient(180deg, #0b1020, #12182b);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .note { color: var(--muted); margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0e1426;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button {
      border: 1px solid var(--border);
      background: #222b45;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    button.primary { background: var(--accent); border-color: transparent; }
    button.danger { background: rgba(251, 113, 133, 0.18); color: #fecdd3; }
    .list { max-height: 320px; overflow: auto; }
    .msg {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .msg small { color: var(--muted); }
    .preview-body { white-space: pre-line; color: #d7def3; }
    .log {
      white-space: pre-wrap;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.8rem;
      background: #0a0f1d;
      border-radius: 8px;
      padding: 10px;
      min-height: 80px;
      border: 1px solid var(--border);
    }
    .ok { color: var(--ok); }
    .err { color: var(--danger); }
    .reward-row { display: grid; grid-template-columns: 1.4fr 0.6fr auto; gap: 8px; margin-bottom: 8px; }
    #compensation-fields[hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>QuestNote Mailbox Publisher</h1>
    <p class="note">
      作者本機工具（僅 127.0.0.1）。正式 QuestNote PWA 不會顯示此介面。
      發布權限來自本機 Git／Repository 寫入權限，不儲存 Token。
    </p>

    <div class="grid">
      <section class="card">
        <h2>建立／編輯信件</h2>
        <div class="row">
          <div>
            <label for="type">類型</label>
            <select id="type">
              <option value="announcement">announcement</option>
              <option value="update">update</option>
              <option value="maintenance">maintenance</option>
              <option value="compensation">compensation</option>
            </select>
          </div>
          <div>
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="normal">normal</option>
              <option value="high">high</option>
              <option value="low">low</option>
            </select>
          </div>
        </div>

        <label for="id">信件 ID</label>
        <div class="row">
          <input id="id" placeholder="2026-07-update-v301" />
          <button type="button" id="btn-gen-id">自動產生 ID</button>
        </div>

        <label for="title">標題</label>
        <input id="title" />

        <label for="body">正文（純文字）</label>
        <textarea id="body"></textarea>

        <div class="row">
          <div>
            <label for="icon">圖示</label>
            <input id="icon" value="📮" />
          </div>
          <div>
            <label for="enabled">Enabled</label>
            <select id="enabled">
              <option value="true">true</option>
              <option value="false">false</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label for="publishedAt">發布時間</label>
            <input id="publishedAt" />
          </div>
          <div>
            <label for="expiresAt">到期時間（可空）</label>
            <input id="expiresAt" placeholder="留空 = 不過期" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="minAppVersion">最低 App 版本</label>
            <input id="minAppVersion" placeholder="3.0.0" />
          </div>
          <div>
            <label for="maxAppVersion">最高 App 版本</label>
            <input id="maxAppVersion" placeholder="可空" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="actionView">內部 Action View</label>
            <select id="actionView">
              <option value="">（無）</option>
            </select>
          </div>
          <div>
            <label for="actionLabel">Action 標籤</label>
            <input id="actionLabel" placeholder="查看冒險手冊" />
          </div>
        </div>

        <div id="compensation-fields" hidden>
          <h3>補償獎勵</h3>
          <div class="row">
            <div>
              <label for="stardust">星塵</label>
              <input id="stardust" type="number" min="0" step="1" value="0" />
            </div>
            <div>
              <label for="adventureEnergy">冒險能量</label>
              <input id="adventureEnergy" type="number" min="0" step="1" value="0" />
            </div>
          </div>
          <label>材料</label>
          <div id="material-rows"></div>
          <button type="button" id="btn-add-material">新增材料</button>
          <label>道具</label>
          <div id="item-rows"></div>
          <button type="button" id="btn-add-item">新增道具</button>
        </div>

        <div class="actions">
          <button type="button" class="primary" id="btn-preview">預覽</button>
          <button type="button" id="btn-validate-msg">驗證此信</button>
          <button type="button" id="btn-add-msg">加入文件</button>
          <button type="button" id="btn-disable-selected">停用選取信件</button>
        </div>
      </section>

      <aside>
        <section class="card">
          <h2>目前信件</h2>
          <div class="list" id="message-list"></div>
          <div class="actions">
            <button type="button" id="btn-reload">重新載入 JSON</button>
            <button type="button" id="btn-validate-doc">驗證整份文件</button>
            <button type="button" class="primary" id="btn-write">寫入本機 JSON</button>
            <button type="button" id="btn-download">下載 JSON</button>
          </div>
        </section>

        <section class="card">
          <h2>預覽</h2>
          <div id="preview"></div>
        </section>

        <section class="card">
          <h2>Git 發布</h2>
          <div id="git-info" class="note"></div>
          <pre class="log" id="git-diff"></pre>
          <label for="publish-confirm">補償發布確認（輸入 PUBLISH）</label>
          <input id="publish-confirm" placeholder="僅補償需要" autocomplete="off" />
          <div class="actions">
            <button type="button" id="btn-git-refresh">重新檢查 Git</button>
            <button type="button" class="danger" id="btn-git-publish">發布到 GitHub</button>
          </div>
        </section>
      </aside>
    </div>

    <section class="card">
      <h2>日誌</h2>
      <pre class="log" id="log"></pre>
    </section>
  </main>
  <script type="module" src="./mailbox-publisher-ui.js"></script>
</body>
</html>
