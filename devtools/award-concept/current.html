<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>QuestNote · Current</title></head>
<body><p>載入目前首頁…</p><script type="module">
  // Render the untouched source document and styles, replacing only its startup.
  // The replacement supplies the same in-memory presentation as the concept.
  const response = await fetch('/index.html', { cache: 'no-store' });
  const source = (await response.text()).replace('<head>', '<head><base href="/">')
    .replace('src="src/bootstrap.js"', 'src="devtools/award-concept/current.js"');
  document.open(); document.write(source); document.close();
</script></body></html>
