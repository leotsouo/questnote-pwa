<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/questnote-pwa-preview/"><title>霓霞仙膳 · 動畫檢視</title>
<style>body{margin:0}main.viewer{overflow-wrap:anywhere;box-sizing:border-box;width:100%;max-width:950px;margin:auto;padding:24px 16px 60px;color:#352d48;background:#f7edf6;font:16px/1.65 system-ui,sans-serif}main.viewer h1{font-size:clamp(24px,5vw,36px)}main.viewer section{padding:16px;border:1px solid #ab9bbb;border-radius:12px;margin:18px 0}main.viewer button,main.viewer select{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #9685ab;border-radius:8px;background:#e5daf0;color:#342545}main.viewer button{cursor:pointer}main.viewer .controls{display:flex;flex-wrap:wrap;gap:10px}main.viewer button:disabled{opacity:.55}main.viewer code,main.viewer pre{white-space:pre-wrap;overflow-wrap:anywhere}main.viewer .result-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}main.viewer .result-cards img{width:100%;aspect-ratio:1;object-fit:cover}main.viewer #rare button,main.viewer #awake button{display:flex;align-items:center;gap:8px}main.viewer button img{width:48px;height:48px;object-fit:cover}main.viewer label{display:inline-block;margin:6px 10px 6px 0}</style></head>
<body data-theme="default"><main class="viewer"><p>中途動畫檢視 · 固定結果，演出不扣星塵、不寫收藏</p><h1>霓霞仙膳 · 晨昏雲廚</h1><p>新作：晨宴與夜宴食籃穿過雲橋，香氣在膳鼎交會。入場 3.4 秒、抽卡前奏 3 秒；SSR 2.5 秒／UR 4.5 秒後等待繼續，沿用正式控制器的略過與交接。</p><p id="artifact"></p><label><input id="reduced" type="checkbox">減少動態</label><label>App 主題 <select id="theme"><option value="default">原始</option><option value="sweet">甜夢</option><option value="twilight">暮光</option></select></label>
<section><h2>入場與切換</h2><div class="controls"><button data-action="entry" disabled>完整入場</button><button data-action="switch" disabled>切換卡池完整登場</button></div></section>
<section><h2>單抽與十連</h2><div class="controls"><select id="single" aria-label="指定角色"></select><button data-action="single" disabled>播放單抽</button><button data-action="ten" disabled>播放十連</button></div><p>固定十連包含全部稀有角色、同次重複及初遇標記。演出內可略過、繼續或關閉總覽。</p><div id="result" aria-live="polite"></div></section>
<section><h2>四位稀有角色登場</h2><div id="rare" class="controls"></div></section><section><h2>覺醒仙女演出</h2><p>此處直接展示核准的仙女造型；正式 App 仍要求羈絆五級、已領取故事、試煉、料理與信物。</p><div id="awake" class="controls"></div></section>
<p id="status" role="status">載入固定產物…</p><details><summary>演出量測紀錄</summary><pre id="metrics"></pre></details></main>
<script type="module">
import { playPoolDebutPresentation, playThemedSummon } from './src/themedSummonController.js';
import { playSummonReveal } from './src/summonRevealService.js';
import { playAwakeningScene } from './src/petAwakeningScene.js';
import { APP_VERSION } from './src/version.js';
const config = await fetch('/review-config.json').then(response => response.json());
await Promise.all(config.styles.map(href => new Promise((resolve, reject) => {const link=document.createElement('link');link.rel='stylesheet';link.href=href;link.onload=resolve;link.onerror=reject;document.head.append(link);} )));
const { pool, pets, awakenings, artifactId } = config;
document.getElementById('artifact').textContent = `V${APP_VERSION} · artifact ${artifactId}`;
const status = document.getElementById('status'), result=document.getElementById('result'), metrics=[];
const byId = new Map(pets.map(pet => [pet.id,pet]));
const fixedIds=['pet_n53','pet_r62','pet_sr56','pet_ssr41','pet_ur31','pet_n53','pet_ssr42','pet_ur32','pet_sr57','pet_ur31'];
const rows = ids => {const seen=new Set();return ids.map(id=>{const pet=byId.get(id),isNew=!seen.has(id);seen.add(id);return {pet,petId:id,rarity:pet.rarity,isNew,duplicateFragments:isNew?0:5};});};
for(const pet of pets){const option=document.createElement('option');option.value=pet.id;option.textContent=`${pet.rarity} ${pet.name}`;document.getElementById('single').append(option);}
for(const entry of awakenings){for(const [container,action,image,label] of [['rare','rare',byId.get(entry.petId).imageVariants.card,entry.name],['awake','awake',entry.awakenedImage.card,entry.title]]){const button=document.createElement('button');button.dataset.action=action;button.dataset.pet=entry.petId;const img=document.createElement('img');img.src=image;img.alt='';button.append(img,label);document.getElementById(container).append(button);}}
let busy=false;const reduced=()=>document.getElementById('reduced').checked;
document.getElementById('theme').onchange=event=>document.body.dataset.theme=event.target.value;
const show=items=>{result.replaceChildren();const grid=document.createElement('div');grid.className='result-cards';for(const item of items){const card=document.createElement('div'),img=document.createElement('img'),text=document.createElement('p');img.src=item.pet.imageVariants.stage || item.pet.image;img.alt=item.pet.name;text.textContent=`${item.pet.name} · ${item.isNew?'初次相遇':'固定重複／碎片 +5'}`;card.append(img,text);grid.append(card);}result.append(grid);};
const observed=new WeakMap();new MutationObserver(()=>{for(const overlay of document.querySelectorAll('.summon-reveal-overlay,.dream-debut-overlay')){if(!observed.has(overlay))observed.set(overlay,performance.now());if(overlay.classList.contains('is-ready')&&!overlay.dataset.viewerMeasured){overlay.dataset.viewerMeasured='true';metrics.push({stage:'ready',rarity:overlay.dataset.rarity,name:overlay.querySelector('.summon-reveal-name')?.textContent,milliseconds:Math.round(performance.now()-observed.get(overlay))});document.getElementById('metrics').textContent=JSON.stringify(metrics,null,2);}}}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
document.querySelector('main.viewer').onclick=async event=>{const button=event.target.closest('[data-action]');if(!button||busy)return;busy=true;document.querySelectorAll('[data-action]').forEach(button=>button.disabled=true);document.getElementById('theme').disabled=true;document.getElementById('reduced').disabled=true;const action=button.dataset.action,start=performance.now();try{status.textContent='演出中；可使用演出內的略過或繼續。';if(action==='entry'||action==='switch')await playPoolDebutPresentation({poolId:pool.id,poolName:pool.name,presentation:pool.presentation,reduceMotion:reduced()});else if(action==='awake'){const entry=awakenings.find(entry=>entry.petId===button.dataset.pet);await playAwakeningScene(entry,byId.get(entry.petId),{reducedMotion:reduced()});}else if(action==='rare'){const pet=byId.get(button.dataset.pet);await playSummonReveal({pet,rarity:pet.rarity,reduceMotion:reduced(),presentationKey:pool.presentation.animationKey});show(rows([pet.id]));}else{const items=rows(action==='ten'?fixedIds:[document.getElementById('single').value]);await playThemedSummon({results:items,mode:action==='ten'?'ten':'single',reduceMotion:reduced(),poolName:pool.name,animationKey:pool.presentation.animationKey});show(items);}metrics.push({action,milliseconds:Math.round(performance.now()-start),reduced:reduced()});status.textContent='演出完成；可以重播或選擇下一項。';}catch(error){status.textContent='播放失敗：'+error.message;}finally{busy=false;document.querySelectorAll('[data-action]').forEach(button=>button.disabled=false);document.getElementById('theme').disabled=false;document.getElementById('reduced').disabled=false;document.getElementById('metrics').textContent=JSON.stringify(metrics,null,2);}};
document.querySelectorAll('[data-action]').forEach(button=>button.disabled=false);status.textContent='已就緒；請選擇要檢視的演出。';
</script></body></html>
