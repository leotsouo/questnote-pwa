<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuestNote · 相遇與指定邀請預覽</title><link rel="stylesheet" href="../src/styles.css"><link rel="stylesheet" href="../src/ui-polish.css"><link rel="stylesheet" href="../src/summon-polish.css"><link rel="stylesheet" href="../src/honeylight-sugar.css"><link rel="stylesheet" href="../src/swordwild-shanhe.css"><link rel="stylesheet" href="../src/lionheart.css"><link rel="stylesheet" href="../src/encounter-ceremony.css"><link rel="stylesheet" href="../src/themeTokens.css"><link rel="stylesheet" href="../src/theme-system.css"><link rel="stylesheet" href="../src/theme-refinements.css"><link rel="stylesheet" href="../src/font-size-settings.css"><link rel="stylesheet" href="../src/encounter-view.css"><link rel="stylesheet" href="../src/encounter-invitation.css"><style>body{margin:0}.preview-controls{padding:12px 18px;background:var(--color-bg-surface);font:13px system-ui;display:flex;gap:8px;flex-wrap:wrap}.preview-controls label{display:grid;gap:4px}.preview-controls select{min-height:36px;background:var(--color-bg-card);color:var(--color-text-main);max-width:100%}.preview-note{font:12px system-ui;color:var(--color-text-muted);padding:8px 18px}.preview-host{max-width:740px;margin:auto}.preview-host .invitation-content{padding-bottom:36px}.preview-host[data-direction="path"] .invitation-gallery-row{border:0}.preview-host[data-direction="path"] .invitation-gallery-art{border-radius:50%;border:1px solid var(--color-accent)}.preview-host[data-direction="journal"]{font-family:var(--font-display)}.preview-host[data-direction="journal"] .invitation-gallery-art{border-radius:8px}.preview-host[data-direction="journal"] .invitation-gallery-row{border-style:dashed}.preview-care-art{width:100%;max-width:440px;aspect-ratio:1;object-fit:contain;margin:20px auto;border-radius:18px}</style></head><body data-theme="default"><div class="preview-controls"><label>檢視情境<select id="scenario"></select></label><label>主題<select id="theme"><option value="default">星夜遠行</option><option value="sweet">晨光花園</option><option value="twilight">暮光冒險手帳</option></select></label><label>Art Direction<select id="direction"><option value="traces">重逢光痕</option><option value="path">同行星路</option><option value="journal">手記邀約</option></select></label><label>動態<select id="motion"><option value="full">完整演出</option><option value="reduced">減少動態</option></select></label><label>文字<select id="font"><option value="standard">標準</option><option value="extra-large">特大</option></select></label></div><p class="preview-note">設計預覽 · 使用正式角色與記憶體範例資料，沒有召喚、扣款、存檔或遠端追蹤。</p><main id="preview" class="identity-review preview-host" tabindex="-1"></main><script type="module" src="./encounter-invitation-preview.js"></script></body></html>
