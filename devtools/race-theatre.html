<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四種賽跑劇本 · QuestNote 試玩</title>
<link rel="stylesheet" href="../src/daily-race.css">
<style>
:root { color-scheme:dark; --color-text-main:#edf2fc; --color-text-secondary:#b4c3da; --color-primary:#c8b5ff; }
* { box-sizing:border-box; } body { margin:0; background:radial-gradient(ellipse at top,#26354e,#0e1727 70%); color:#edf2fc; font:16px/1.65 system-ui,sans-serif; min-height:100vh; }
main { max-width:580px; margin:auto; padding:26px 18px 40px; } .eyebrow { font-size:.7rem; color:#d3bfff; letter-spacing:.15em; } h1 { font-size:1.6rem; margin:6px 0; } p { color:#bac8dc; margin:8px 0 18px; } .intro { font-size:.88rem; }
button { cursor:pointer; font:inherit; border:1px solid #7b8ca25c; background:#273b53; color:#edf2fc; border-radius:12px; padding:10px 15px; min-height:46px; } button:focus-visible { outline:3px solid #eed498; outline-offset:3px; } .primary { background:#ddceff; color:#242037; border-color:#ddceff; font-weight:700; }
.controls { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; } .controls button { flex:1; } #stage { margin-top:24px; } .cast { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:24px 0; } .cast img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:15px; } .cast small { display:block; font-size:.72rem; text-align:center; line-height:1.5; } .result { text-align:center; padding:22px 0; } .result img { width:108px; height:108px; border-radius:22px; border:2px solid #ffe2a0; } .result h2 { font-size:1.4rem; } .badge { display:inline-block; padding:7px 12px; background:#d9c18819; color:#ffe3a2; border-radius:30px; font-size:.82rem; } .reduced { display:block; margin-top:22px; font-size:.82rem; color:#bac8dc; } .foot { margin-top:20px; font-size:.75rem; }
select { width:100%; min-height:46px; border:1px solid #7b8ca25c; border-radius:10px; color:#edf2fc; background:#273b53; font:inherit; padding:9px; } .script-label { display:block; font-size:.8rem; margin-bottom:6px; }
</style></head><body><main><span class="eyebrow">QUESTNOTE · 四種劇本 · 20 秒試玩</span><h1>今天會是哪一場鬧劇？</h1><p class="intro">正常競速、活眼終點、領先者打瞌睡、全員跑錯方向。<br>每場 20 秒，可指定劇本或隨機四選一。</p><label class="script-label" for="script">試玩劇本</label><select id="script" aria-label="試玩劇本"></select><div id="stage" aria-live="off">正在邀請四位夥伴…</div>
<div class="controls"><button id="play" class="primary" disabled>開始試玩</button><button id="shuffle" disabled>換一場（重新抽選）</button></div><label class="reduced"><input id="reduced" type="checkbox"> 減少動態（直接顯示最後位置）</label><p class="foot">可不限次數試玩 · 不扣星塵、不使用每日場次。<br>這個試玩頁使用與 App 相同的賽跑動畫。</p></main><script type="module" src="./race-theatre.js"></script></body></html>
