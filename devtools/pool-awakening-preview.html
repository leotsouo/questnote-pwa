<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pool Awakening Preview（Dev）</title>
  <link rel="stylesheet" href="../src/styles.css">
  <style>
    body {
      margin: 0;
      padding: max(1rem, env(safe-area-inset-top)) 1rem 2rem;
      font-family: system-ui, sans-serif;
      background: #100e18;
      color: #fff4e8;
    }
    .preview-panel {
      max-width: 34rem;
      margin: 0 auto;
      display: grid;
      gap: 0.75rem;
    }
    .preview-panel h1 { font-size: 1.15rem; margin: 0; }
    .preview-panel p { margin: 0; color: #c9b8a4; font-size: 0.85rem; }
    .preview-row {
      display: grid;
      grid-template-columns: 8rem 1fr;
      gap: 0.5rem;
      align-items: center;
    }
    select, button, input {
      padding: 0.45rem 0.6rem;
      border-radius: 0.45rem;
      border: 1px solid rgba(232, 194, 122, 0.35);
      background: #1c1628;
      color: inherit;
    }
    button { cursor: pointer; background: #3a2a3a; }
    .warn {
      padding: 0.65rem 0.75rem;
      border-radius: 0.55rem;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.3);
      font-size: 0.8rem;
      color: #fbbf24;
    }
    .state-box {
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      white-space: pre-wrap;
      background: rgba(0,0,0,0.35);
      border-radius: 0.5rem;
      padding: 0.65rem;
    }
  </style>
</head>
<body>
  <div class="preview-panel">
    <h1>晨醒花庭解鎖動畫預覽（開發用）</h1>
    <p>不消耗星塵、不寫入收藏、不更新保底、不寫入真實解鎖狀態。以 mock state 模擬。</p>
    <div class="warn">此頁不屬於正式 App 導航，請勿加入 Service Worker precache。</div>

    <div class="preview-row">
      <label for="draws">lifetimeDraws</label>
      <select id="draws">
        <option value="0">0／20</option>
        <option value="19">19／20</option>
        <option value="20" selected>20／20</option>
        <option value="25">25／20</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="unlocked">unlocked</label>
      <select id="unlocked">
        <option value="false">未解鎖</option>
        <option value="true" selected>已解鎖</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="reward">rewardClaimed</label>
      <select id="reward">
        <option value="false">未領取</option>
        <option value="true" selected>已領取</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="seen">animationSeen</label>
      <select id="seen">
        <option value="false" selected>未看</option>
        <option value="true">已看</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="motion">Reduced Motion</label>
      <select id="motion">
        <option value="false" selected>正常</option>
        <option value="true">開啟</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="fallback">強制 fallback</label>
      <select id="fallback">
        <option value="false" selected>否</option>
        <option value="true">是</option>
      </select>
    </div>

    <div class="preview-row">
      <label for="pending">pendingAwakening 流程</label>
      <select id="pending">
        <option value="direct" selected>直接播解鎖</option>
        <option value="after-result">模擬結果關閉後再播</option>
      </select>
    </div>

    <button type="button" id="btn-play">播放解鎖動畫</button>
    <button type="button" id="btn-skip">略過（若播放中）</button>
    <div class="state-box" id="state-box"></div>
  </div>

  <script type="module">
    import { playMorningGardenUnlock, skipPoolAwakening } from '../src/poolAwakeningController.js';

    const MOCK_PETS = [
      { id: 'pet_ur05', name: '永眠花皇兔', rarity: 'UR', title: '永眠花海的月皇', image: 'assets/pets/pet_ur05.png' },
      { id: 'pet_r16', name: '曉露花蝟', rarity: 'R', title: '晨露啟花者', image: 'assets/pets/pet_r16.png' },
      { id: 'pet_sr12', name: '晨鈴花雀', rarity: 'SR', title: '枝冠初鳴者', image: 'assets/pets/pet_sr12.png' },
      { id: 'pet_ssr07', name: '曦幕雲鶴', rarity: 'SSR', title: '夢幕開曦者', image: 'assets/pets/pet_ssr07.png' },
      { id: 'pet_ur06', name: '曙綻花后兔', rarity: 'UR', title: '甦醒花庭的晨曦主人', image: 'assets/pets/pet_ur06.png' },
    ];

    const expansion = {
      key: 'morning_garden',
      threshold: 20,
      title: '晨醒花庭',
      unlockMessage: '沉眠有歸，甦醒有時。',
      rewardPetId: 'pet_r16',
      animationKey: 'morning_garden_unlock',
      extraPoolTags: ['eternal_slumber_bloom_awakened'],
    };

    function readMockState() {
      return {
        lifetimeDraws: Number(document.getElementById('draws').value),
        unlocked: document.getElementById('unlocked').value === 'true',
        rewardClaimed: document.getElementById('reward').value === 'true',
        animationSeen: document.getElementById('seen').value === 'true',
      };
    }

    function renderState(extra = '') {
      const mock = readMockState();
      document.getElementById('state-box').textContent = JSON.stringify({ mock, note: '此預覽不寫入 IndexedDB', extra }, null, 2);
    }

    document.getElementById('btn-play').addEventListener('click', async () => {
      const mock = readMockState();
      const reduceMotion = document.getElementById('motion').value === 'true';
      const forceFallback = document.getElementById('fallback').value === 'true';
      const pendingMode = document.getElementById('pending').value;
      const rewardPet = MOCK_PETS.find((p) => p.id === 'pet_r16');
      renderState('playing…');

      if (pendingMode === 'after-result') {
        // 模擬：先顯示結果遮罩，關閉後才播解鎖（不寫真實狀態）
        const gate = document.createElement('div');
        gate.className = 'pool-awakening-fallback';
        gate.innerHTML = '<h2>模擬第 20 抽結果</h2><p>按下繼續後才播放晨醒解鎖</p>';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '繼續';
        gate.appendChild(btn);
        document.body.appendChild(gate);
        await new Promise((resolve) => btn.addEventListener('click', () => { gate.remove(); resolve(); }, { once: true }));
      }

      const outcome = await playMorningGardenUnlock({
        allPets: MOCK_PETS,
        expansion,
        rewardPet,
        reduceMotion,
        forceFallback,
      });
      renderState({ ...outcome, mock });
    });

    document.getElementById('btn-skip').addEventListener('click', () => {
      skipPoolAwakening();
    });

    ['draws', 'unlocked', 'reward', 'seen', 'motion', 'fallback'].forEach((id) => {
      document.getElementById(id).addEventListener('change', () => renderState());
    });
    renderState();
  </script>
</body>
</html>
