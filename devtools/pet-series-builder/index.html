<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuestNote Pet Series Builder</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>QuestNote Pet Series Builder</h1>
      <p class="topbar__sub">作者本機工具 · 127.0.0.1:4174 · 不進入正式 App</p>
    </div>
    <div class="topbar__actions">
      <button type="button" id="btn-save" class="btn btn--primary">保存工作區</button>
      <button type="button" id="btn-validate" class="btn">驗證</button>
      <button type="button" id="btn-dry-run" class="btn">Dry Run</button>
      <button type="button" id="btn-publish" class="btn btn--danger">發布到專案</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel panel--left">
      <section class="block">
        <h2>系列</h2>
        <label class="field">
          <span>載入工作區</span>
          <select id="workspace-select">
            <option value="">— 選擇 —</option>
          </select>
        </label>
        <button type="button" id="btn-load" class="btn btn--block">載入</button>
        <hr />
        <h3>建立新系列</h3>
        <label class="field">
          <span>seriesId（小寫／數字／底線）</span>
          <input id="new-series-id" placeholder="starlight_garden" autocomplete="off" />
        </label>
        <label class="field">
          <span>系列名稱</span>
          <input id="new-series-name" placeholder="星光庭園" />
        </label>
        <button type="button" id="btn-create" class="btn btn--block btn--primary">建立系列</button>
      </section>

      <section class="block" id="series-editor" hidden>
        <h2>系列資料</h2>
        <label class="field"><span>seriesId</span><input id="series-id" readonly /></label>
        <label class="field"><span>系列名稱</span><input id="series-name" /></label>
        <label class="field"><span>描述</span><textarea id="series-desc" rows="3"></textarea></label>
        <label class="field"><span>themeKeywords（逗號分隔）</span><input id="series-keywords" /></label>
        <label class="field"><span>releaseVersion</span><input id="series-release" /></label>
        <div class="rarity-plan">
          <span>rarityPlan</span>
          <div class="rarity-plan__grid" id="rarity-plan"></div>
        </div>
      </section>

      <section class="block" id="pet-list-block" hidden>
        <div class="block__head">
          <h2>寵物清單</h2>
          <button type="button" id="btn-add-pet" class="btn btn--sm">新增</button>
        </div>
        <ul id="pet-list" class="pet-list"></ul>
      </section>
    </aside>

    <section class="panel panel--center" id="editor-panel" hidden>
      <div class="tabs">
        <button type="button" class="tab is-active" data-tab="pet">寵物資料</button>
        <button type="button" class="tab" data-tab="lore">Lore</button>
        <button type="button" class="tab" data-tab="image">圖片與 Prompt</button>
      </div>

      <div class="tab-panel is-active" data-panel="pet">
        <div class="grid-2">
          <label class="field">
            <span>ID 類型</span>
            <select id="pet-id-type">
              <option value="standard">一般寵物</option>
              <option value="special_sp">特殊 SP</option>
            </select>
          </label>
          <label class="field">
            <span>稀有度</span>
            <select id="pet-rarity">
              <option>N</option><option>R</option><option>SR</option><option>SSR</option><option>UR</option>
            </select>
          </label>
        </div>
        <div class="inline-row">
          <label class="field grow">
            <span>ID（自動）</span>
            <input id="pet-id" readonly />
          </label>
          <button type="button" id="btn-alloc-id" class="btn">重新分配 ID</button>
        </div>
        <label class="field"><span>名稱</span><input id="pet-name" /></label>
        <label class="field"><span>短描述</span><textarea id="pet-desc" rows="2"></textarea></label>
        <label class="field">
          <span>pets.json element（內部主題鍵，例如 light_core）</span>
          <input id="pet-element" placeholder="star_nature" />
        </label>
        <label class="field"><span>speciesType</span><input id="pet-species" /></label>
        <label class="field"><span>visualTheme</span><input id="pet-visual" /></label>
        <label class="field"><span>seriesId</span><input id="pet-series-id" readonly /></label>
        <div class="field">
          <span>poolTags（系列 ID 不會自動加入）</span>
          <div id="pool-tags" class="chips"></div>
          <div class="inline-row">
            <input id="pool-tag-custom" placeholder="新增自訂 tag" />
            <button type="button" id="btn-add-tag" class="btn btn--sm">加入</button>
          </div>
          <p class="hint">新 tag 若無 Pool 使用，不會產生抽卡效果（會 warning）。</p>
        </div>
        <div class="inline-row">
          <button type="button" id="btn-dup-pet" class="btn">複製為模板</button>
          <button type="button" id="btn-del-pet" class="btn btn--danger">刪除寵物</button>
        </div>
      </div>

      <div class="tab-panel" data-panel="lore">
        <label class="field"><span>稱號 title</span><input id="lore-title" /></label>
        <label class="field">
          <span>personality（逗號分隔，建議 3 個）</span>
          <input id="lore-personality" />
        </label>
        <label class="field">
          <span>pets-lore.json element（顯示屬性，例如 光）</span>
          <input id="lore-element" />
        </label>
        <label class="field"><span>完整 lore</span><textarea id="lore-text" rows="4"></textarea></label>
        <div id="dialogue-status" class="dialogue-status"></div>
        <div id="dialogue-fields"></div>
        <h3>羈絆解鎖</h3>
        <label class="field"><span>bondUnlock 2</span><textarea id="bond-2" rows="2"></textarea></label>
        <label class="field"><span>bondUnlock 3</span><textarea id="bond-3" rows="2"></textarea></label>
        <label class="field"><span>bondUnlock 4</span><textarea id="bond-4" rows="2"></textarea></label>
        <label class="field"><span>bondUnlock 5</span><textarea id="bond-5" rows="2"></textarea></label>
        <label class="field"><span>summon</span><input id="lore-summon" /></label>
      </div>

      <div class="tab-panel" data-panel="image">
        <label class="field">
          <span>選擇 PNG（建議 1024×1024、透明、&lt;2MB）</span>
          <input type="file" id="image-file" accept="image/png,.png" />
        </label>
        <div id="image-checks" class="image-checks"></div>
        <label class="field"><span>prompt</span><textarea id="prompt-text" rows="4"></textarea></label>
        <label class="field"><span>negativePrompt</span><textarea id="prompt-neg" rows="3"></textarea></label>
        <label class="field"><span>notes</span><textarea id="prompt-notes" rows="2"></textarea></label>
      </div>
    </section>

    <aside class="panel panel--right">
      <section class="block">
        <h2>預覽</h2>
        <div class="preview-theme">
          <button type="button" class="btn btn--sm is-active" data-theme="default">Default</button>
          <button type="button" class="btn btn--sm" data-theme="sweet">Sweet</button>
        </div>
        <div class="preview-image-wrap">
          <img id="preview-image" alt="寵物預覽" hidden />
          <p id="preview-image-empty" class="muted">尚未選擇圖片</p>
        </div>
        <iframe id="preview-frame" class="preview-frame" title="圖鑑／詳情預覽"></iframe>
      </section>

      <section class="block">
        <h2>驗證結果</h2>
        <div id="validation-out" class="log"></div>
      </section>

      <section class="block">
        <h2>Pool Preview</h2>
        <div id="pool-preview" class="log"></div>
      </section>
    </aside>
  </main>

  <dialog id="publish-dialog">
    <form method="dialog" class="dialog-form">
      <h2>發布確認</h2>
      <p>Errors 必須為 0。若有 Warnings，請勾選確認。</p>
      <label class="check">
        <input type="checkbox" id="ack-warnings" />
        我已確認所有 Warnings
      </label>
      <label class="field">
        <span>輸入系列 ID 以最終確認</span>
        <input id="confirm-series-id" autocomplete="off" />
      </label>
      <div class="inline-row">
        <button type="submit" value="cancel" class="btn">取消</button>
        <button type="submit" value="ok" class="btn btn--danger">確認發布</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
