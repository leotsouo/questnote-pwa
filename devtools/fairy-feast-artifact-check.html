<link rel="stylesheet" href="src/seniorMode.css"></head><body><h1>霓霞仙膳 · 隔離工程檢查</h1><p>只在本機全新 origin 的 preview 測試存檔操作，使用確切產物模組。此頁與動畫檢視分開。</p><button id="run">執行交易、料理、派遣及覺醒檢查</button><ol id="results"></ol><pre id="report"></pre>
<script type="module">
import { dbGet, dbGetAll, dbPut, STORES } from './src/db.js';
import { createCollectionEntry } from './src/collectionService.js';
import { normalizeWallet } from './src/rewardService.js';
import { loadCatalogBundle } from './src/releaseCatalog.js';
import { RELEASE_PROFILE } from './src/releaseProfile.js';
import { loadCraftables, loadGiftAffinities, craftItem, useBondItem, getFavoriteBonus } from './src/workshopService.js';
import { loadExpeditionAreas, checkAreaUnlock, startExpedition, claimExpeditionRewards } from './src/expeditionService.js';
import { getPetSpecialty, planExpeditionResult } from './src/expeditionGameplay.js';
import { createDefaultExplorationProgress, claimExplorationMilestone, getExplorationMilestones, AREA_STORIES } from './src/explorationService.js';
import { loadBondStories, validateBondStories } from './src/bondJourneyService.js';
import { createBondJourney } from './src/bondJourneyCore.js';
import { loadAwakeningCatalog } from './src/petAwakeningCatalog.js';
import { startPetAwakening, getPetAwakening, awakenPet, setAwakeningForm } from './src/petAwakeningService.js';
import { createTask, toggleTaskComplete } from './src/taskService.js';
import { pullOnce, performTenPull, normalizeGachaStats } from './src/gachaService.js';
import { exportBackup, validateBackup, importBackup } from './src/backupService.js';
const check=(condition,message)=>{if(!condition)throw Error(message);};
const rejected=async action=>{try{await action();return false;}catch{return true;}};
const config=await fetch('/review-config.json').then(r=>r.json());
document.getElementById('run').onclick=async()=>{
 const checks=[];const record=(name,evidence)=>{checks.push({name,evidence,status:'pass'});const li=document.createElement('li');li.textContent='PASS · '+name+' · '+evidence;document.getElementById('results').append(li);};document.getElementById('run').disabled=true;
 try{
  check(location.hostname==='127.0.0.1'&&RELEASE_PROFILE.profile==='preview'&&!navigator.serviceWorker.controller,'需要新隔離 origin');
  check((await dbGetAll(STORES.COLLECTION)).length===0,'此檢查只接受全新測試存檔');
  const catalog=await loadCatalogBundle(),allPets=catalog.petsData.pets,pets=config.pets;
  check(allPets.length===172&&pets.length===12,'新舊角色集合錯誤');record('固定產物與角色集合',RELEASE_PROFILE.artifactId+'／160 舊角色＋12 新角色');
  const stories=await loadBondStories();check(validateBondStories(stories,allPets).length===0,'羈絆故事驗證失敗');record('完整羈絆故事','所有角色都有四章，包含本池 12 隻');
  const wallet=normalizeWallet(null);Object.assign(wallet,{stardust:20000,adventureEnergy:200,materials:{forest_leaf:100,aurora_flower_dew:100}});await dbPut(STORES.META,wallet);await dbPut(STORES.META,{key:'inventory',items:{},itemUsageLogs:{}});
  for(const pet of pets)await dbPut(STORES.COLLECTION,createCollectionEntry(pet.id,new Date().toISOString()));
  const craftables=await loadCraftables();await loadGiftAffinities();const food=craftables.find(food=>food.id==='item_aurora_flower_tart');check(food,'新料理不存在');
  check((await craftItem(food.id,2)).success,'料理製作失敗');const after=await dbGet(STORES.META,'wallet');check(after.materials.forest_leaf===96&&after.materials.aurora_flower_dew===94,'料理扣料錯誤');
  const favorite=pets.find(pet=>pet.id==='pet_ur31'),ordinary=pets.find(pet=>pet.id==='pet_r63');check(getFavoriteBonus(food,favorite).bondExp===150&&getFavoriteBonus(food,ordinary).bondExp===75,'喜好加成錯誤');
  check((await useBondItem(food.id,favorite.id,allPets)).success&&(await useBondItem(food.id,ordinary.id,allPets)).success,'送禮失敗');check((await dbGet(STORES.COLLECTION,favorite.id)).bondExp===150&&(await dbGet(STORES.COLLECTION,ordinary.id)).bondExp===75,'送禮實際數值錯誤');record('料理製作與送禮','兩份扣葉4／花露6；符合偏好總共150，普通75');
  const areas=await loadExpeditionAreas(),area=areas.find(area=>area.id==='aurora_feast_garden');check(!checkAreaUnlock(area,[]).unlocked&&checkAreaUnlock(area,[pets[0]]).unlocked&&checkAreaUnlock(area,[pets.find(p=>p.id==='pet_sr58')]).unlocked,'新地區解鎖條件錯誤');
  for(const pet of pets){check(getPetSpecialty(pet).role===pet.expeditionSpecialty,'專長不一致');for(const stars of [1,5]){const plan=planExpeditionResult(area,[{...pet,stars}],pet.expeditionSpecialty==='gatherer'?'gather':'explore',()=>0);check(plan.specialtySummary[0].role===pet.expeditionSpecialty&&plan.rewards.materials.aurora_flower_dew>0,'專長或材料沒有進入派遣結果');}check([75,150].includes(getFavoriteBonus(food,pet).bondExp),'偏好缺失');}record('逐隻專長、偏好及地區解鎖','12 隻 × 1／5星；初始與擴充靈獸均可解鎖，空集合不可');
  const started=await startExpedition(['pet_ur31','pet_sr56','pet_r63'],area.id,areas,allPets,'explore'),exp=started.expedition||started;check(Date.parse(exp.endsAt)-Date.parse(exp.startedAt)===3600000&&exp.energyCost===5,'派遣時間／能量錯誤');exp.endsAt=new Date(Date.now()-1000).toISOString();await dbPut(STORES.EXPEDITIONS,exp);await claimExpeditionRewards(exp.id,areas,allPets);check(await rejected(()=>claimExpeditionRewards(exp.id,areas,allPets)),'派遣重複領獎');record('派遣與花露實際領取','60分鐘／5能量，重複領獎拒絕；僅測試縮短等待時間');
  const progress=createDefaultExplorationProgress();progress.areas[area.id].progress=100;await dbPut(STORES.META,progress);const before=await dbGet(STORES.META,'wallet');const milestones=await Promise.all([10,25,50,75,100].flatMap(percent=>[claimExplorationMilestone(area.id,percent),claimExplorationMilestone(area.id,percent)]));check(milestones.filter(row=>row.success).length===5,'里程碑重複領獎');check((await dbGet(STORES.META,'wallet')).stardust-before.stardust===410,'里程碑星塵錯誤');check(getExplorationMilestones(area.id).every(row=>AREA_STORIES[row.storyId]?.length>10),'里程碑故事缺失');record('五個探索里程碑','10次並行請領只成功5次，星塵410與五段故事');
  const draw=async action=>{const random=Math.random;try{Math.random=()=>0;return await action();}finally{Math.random=random;}};
  const drawBefore=await dbGet(STORES.META,'wallet');for(let i=0;i<2;i++){const ten=await draw(()=>performTenPull(allPets,catalog.poolsData,config.pool.id));check(ten.success&&ten.results.length===10&&ten.results.some(row=>['SR','SSR','UR'].includes(row.rarity)),'十連保障失敗');}check(drawBefore.stardust-(await dbGet(STORES.META,'wallet')).stardust===2000,'二十抽扣款錯誤');const unlock=await dbGet(STORES.META,'poolUnlockState');check(unlock.byPool[config.pool.id].unlocked&&unlock.byPool[config.pool.id].lifetimeDraws===20,'二十抽擴充失敗');record('十連、同次重複與二十抽擴充','兩次十連扣2000，SR保障，擴充與贈寵在實際交易中完成');
  for(const [random,expected] of [[0,'pet_ur31'],[0.99,'pet_ur32']]){const stats=normalizeGachaStats(await dbGet(STORES.META,'gachaStats'));stats.poolPity[config.pool.id]={ssrPity:0,urPity:99};await dbPut(STORES.META,stats);const old=Math.random;try{Math.random=()=>random;const one=await pullOnce(allPets,catalog.poolsData,config.pool.id);check(one.triggeredPity&&one.pet.id===expected,'雙UR保底錯誤');}finally{Math.random=old;}}record('雙 UR 保底','第100抽兩個候選都能選到');
  await dbPut(STORES.META,{...await dbGet(STORES.META,'wallet'),stardust:100});const races=await Promise.allSettled([pullOnce(allPets,catalog.poolsData,config.pool.id),pullOnce(allPets,catalog.poolsData,config.pool.id)]);check(races.filter(row=>row.status==='fulfilled').length===1&&(await dbGet(STORES.META,'wallet')).stardust===0,'並行抽卡超扣');record('抽卡原子交易','只有一次費用時，兩次並行僅一次成功');
  const awake=await loadAwakeningCatalog();check(awake.pets.filter(row=>pets.some(pet=>pet.id===row.petId)).length===4,'覺醒名單錯誤');check(await rejected(()=>startPetAwakening('pet_sr56')),'SR不應可覺醒');check(await rejected(()=>startPetAwakening('pet_ur32')),'低羈絆不應接受試煉');
  const journey=createBondJourney(),at=new Date(Date.now()-3600000).toISOString();for(const entry of config.awakenings){await dbPut(STORES.COLLECTION,{...await dbGet(STORES.COLLECTION,entry.petId),bondLevel:5,bondExp:500});journey.byPet[entry.petId]={chapters:Object.fromEntries([2,3,4,5].map(level=>[level,{choiceId:'gentle',readAt:at,completedAt:at,claimedAt:at}]))};}await dbPut(STORES.META,journey);await dbPut(STORES.META,{...await dbGet(STORES.META,'wallet'),stardust:10000,adventureEnergy:100});await dbPut(STORES.META,{key:'inventory',items:{[food.id]:4},itemUsageLogs:{}});
  for(const entry of config.awakenings){await startPetAwakening(entry.petId);check((await getPetAwakening()).byPet[entry.petId].eventKeys.length===0,'舊完成倒灌');for(let i=0;i<3;i++){await new Promise(resolve=>setTimeout(resolve,5));const task=await createTask({content:`${entry.name}新日常${i}`,priority:'normal'});await toggleTaskComplete(task.id);}const departing=await startExpedition([entry.petId],area.id,areas,allPets,'bond'),outing=departing.expedition||departing;outing.endsAt=new Date(Date.now()-1000).toISOString();await dbPut(STORES.EXPEDITIONS,outing);await claimExpeditionRewards(outing.id,areas,allPets);check((await getPetAwakening()).byPet[entry.petId].status==='ready','新日常與新派遣沒有完成試煉');await awakenPet(entry.petId);check(await rejected(()=>awakenPet(entry.petId)),'覺醒重複扣料');await setAwakeningForm(entry.petId,'initial');await setAwakeningForm(entry.petId,'awakened');}check((await dbGet(STORES.META,'inventory')).items[food.id]===0,'四次覺醒扣料不正確');record('四位 SSR／UR 完整試煉與形態切換','舊事件不計入；每位3個新任務＋新膳庭派遣領取，料理各扣一次；SR及未達條件拒絕');
  const backup=await exportBackup();check(validateBackup(backup).valid,'備份無法驗證');const snapshot=JSON.stringify(await getPetAwakening());await importBackup(backup);await importBackup(backup);check(JSON.stringify(await getPetAwakening())===snapshot,'重複匯入遺失覺醒');record('新舊備份相容','目前備份連續還原兩次，四位覺醒與材料狀態保持');
  document.getElementById('report').textContent=JSON.stringify({status:'pass',artifactId:config.artifactId,sourceCommit:config.sourceCommit,origin:location.origin,checkedAt:new Date().toISOString(),checks},null,2);
 }catch(error){document.getElementById('report').textContent=JSON.stringify({status:'fail',error:error.message,checks},null,2);}
};
</script><section><h2>隔離動畫驗收</h2><p>固定結果，只播放實際 artifact 動畫，不抽卡、不扣款、不寫收藏。</p><button id="animation-run">執行動畫順序／略過／圖片失敗檢查</button><pre id="animation-report"></pre></section>
<script type="module">
import { playPoolDebutPresentation, playThemedSummon, skipThemedSummon } from './src/themedSummonController.js';
import { dbGet, dbGetAll, STORES } from './src/db.js';
const output=document.getElementById('animation-report');
const assert=(condition,message)=>{if(!condition)throw Error(message);};
const saved=async()=>JSON.stringify(await Promise.all([dbGet(STORES.META,'wallet'),dbGet(STORES.META,'gachaStats'),dbGet(STORES.META,'poolUnlockState'),dbGetAll(STORES.COLLECTION)]));
document.getElementById('animation-run').onclick=async()=>{
 document.getElementById('animation-run').disabled=true;
 const config=await fetch('/review-config.json').then(r=>r.json());const {pool,pets}=config;
 const checks=[];let active;let driver;const seen=new WeakSet();let reveals=[];let summary=[];let failedImage=false;let interrupted=false;
 const update=()=>output.textContent=JSON.stringify({running:true,artifactId:config.artifactId,checks},null,2);
 const fixed=['pet_n53','pet_r62','pet_sr56','pet_ssr41','pet_ur31','pet_ur32','pet_n54','pet_ur31','pet_ssr42','pet_ur32'];
 const rows=(ids)=>{const obtained=new Set();return ids.map(id=>{const pet=structuredClone(pets.find(p=>p.id===id));const isNew=!obtained.has(id);obtained.add(id);return {pet,petId:id,rarity:pet.rarity,isNew,duplicateFragments:isNew?0:5};});};
 const run=async(name,options,ids=fixed)=>{
  active=options;reveals=[];summary=[];failedImage=false;interrupted=false;update();
  const before=await saved();const input=rows(ids);
  if(options.badImage)for(const row of input){row.pet.image='/intentionally-missing-card.png';row.pet.imageVariants={card:row.pet.image,stage:row.pet.image};}
  const original=JSON.stringify(input);const start=performance.now();
  const result=options.debut?await playPoolDebutPresentation({poolName:pool.name,presentation:pool.presentation,reduceMotion:options.reduce}):await playThemedSummon({results:input,mode:ids.length===1?'single':'ten',reduceMotion:options.reduce,poolName:pool.name,animationKey:pool.presentation.animationKey});
  assert(await saved()===before,'動畫改變玩家交易狀態');assert(JSON.stringify(input)===original,'動畫改寫既定結果');
  if(!options.debut){assert(result.ok,'動畫沒有完成');if(ids.length===10)assert(JSON.stringify(summary)===JSON.stringify(input.map(r=>r.pet.name)),'十連結果遺失或重排');}
  if(options.verifyQueue){const expected=input.filter(r=>['SSR','UR'].includes(r.rarity)).map(r=>r.pet.name);assert(JSON.stringify(reveals)===JSON.stringify(expected),'稀有揭示順序或重複項目遺失');}
  if(options.badImage)assert(failedImage,'未觀察到圖片失敗備援');
  checks.push({name,status:'pass',milliseconds:Math.round(performance.now()-start),reveals,summary,failedImage,transactionStateUnchanged:true});update();
 };
 driver=setInterval(()=>{
  if(!active)return;
  const debut=document.querySelector('.dream-debut-overlay');const debutButton=debut?.querySelector('[data-role="skip"]');
  if(debutButton && (active.skipEntry || debutButton.textContent.includes('繼續')))debutButton.click();
  const reveal=document.querySelector('.summon-reveal-overlay');
  if(reveal && !seen.has(reveal)){seen.add(reveal);reveals.push(reveal.querySelector('.summon-reveal-name')?.textContent||'');}
  if(reveal?.querySelector('.summon-reveal-fallback-label'))failedImage=true;
  const next=reveal?.querySelector('.summon-reveal-skip');
  if(active.interrupt && reveal && !interrupted){interrupted=true;skipThemedSummon();}
  else if(next && (active.skipReveal || next.textContent==='繼續')){next.click();if(active.doubleClick)next.click();}
  const intro=document.querySelector('.dream-bloom-overlay [data-action="skip"]');
  if(active.skipIntro && intro && !intro.hidden)intro.click();
  const close=document.querySelector('.dream-bloom-overlay [data-action="close"]');
  if(close && !close.hidden){summary=[...document.querySelectorAll('.dream-bloom-mini-seal__name')].map(e=>e.textContent);close.click();}
 },80);
 try{
  await run('完整登場與繼續',{debut:true,reduce:false});
  await run('切換卡池完整登場',{debut:true,reduce:false});
  await run('登場提前略過',{debut:true,skipEntry:true});
  await run('單抽一般卡完整前奏',{reduce:false},['pet_n53']);
  await run('正常十連雙UR／兩SSR及重複',{reduce:false,verifyQueue:true});
  await run('減少動態十連及繼續連點',{reduce:true,verifyQueue:true,doubleClick:true});
  await run('略過前奏仍保留稀有順序',{reduce:true,skipIntro:true,verifyQueue:true});
  await run('略過揭示仍有完整十連',{reduce:false,skipIntro:true,skipReveal:true});
  await run('圖片失敗仍有完整結果',{reduce:true,badImage:true,verifyQueue:true});
  await run('外部中斷仍保留完整結果',{reduce:true,interrupt:true});
  output.textContent=JSON.stringify({status:'pass',running:false,artifactId:config.artifactId,checkedAt:new Date().toISOString(),checks},null,2);
 }catch(error){output.textContent=JSON.stringify({status:'fail',running:false,artifactId:config.artifactId,error:error.message,checks},null,2);}
 finally{clearInterval(driver);document.getElementById('animation-run').disabled=false;}
};
</script></body></html>
