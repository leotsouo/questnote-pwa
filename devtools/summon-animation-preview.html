<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Summon Animation Preview（Dev）</title>
  <link rel="stylesheet" href="../src/styles.css">
  <style>
    body {
      margin: 0;
      padding: max(1rem, env(safe-area-inset-top)) 1rem 2rem;
      font-family: system-ui, sans-serif;
      background: #080b16;
      color: #f4f7ff;
    }
    .preview-panel {
      max-width: 36rem;
      margin: 0 auto;
      display: grid;
      gap: 0.75rem;
    }
    .preview-panel h1 { font-size: 1.15rem; margin: 0; }
    .preview-panel h2 { font-size: 0.95rem; margin: 0.5rem 0 0; color: #c7d2fe; }
    .preview-panel p { margin: 0; color: #9ba8c7; font-size: 0.85rem; }
    .preview-row {
      display: grid;
      grid-template-columns: 8.5rem 1fr;
      gap: 0.5rem;
      align-items: center;
    }
    select, button {
      padding: 0.45rem 0.6rem;
      border-radius: 0.45rem;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #141a2e;
      color: inherit;
    }
    button {
      cursor: pointer;
      background: #2a2150;
    }
    .btn-grid {
      display: grid;
      gap: 0.45rem;
    }
    .warn {
      padding: 0.65rem 0.75rem;
      border-radius: 0.55rem;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.3);
      font-size: 0.8rem;
      color: #fbbf24;
    }
    #log {
      white-space: pre-wrap;
      font-size: 0.75rem;
      background: #0c1020;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 0.5rem;
      padding: 0.6rem;
      max-height: 14rem;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="preview-panel">
    <h1>召喚動畫預覽（開發用）</h1>
    <p>不消耗星塵、不寫入收藏、不更新保底。以 mock result 餵入動畫控制器。</p>
    <div class="warn">此頁不屬於正式 App 導航，請勿加入 Service Worker precache。</div>

    <div class="preview-row">
      <label for="theme">Pool theme</label>
      <select id="theme">
        <option value="dream_bloom">eternal_slumber_bloom / dream_bloom</option>
        <option value="ssrplus_only">僅 SSR+ reveal queue</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="mode">模式</label>
      <select id="mode">
        <option value="single">單抽</option>
        <option value="ten">十連</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="rarity">稀有度</label>
      <select id="rarity">
        <option>N</option>
        <option>R</option>
        <option>SR</option>
        <option>SSR</option>
        <option selected>UR</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="ur-pick">UR 角色</label>
      <select id="ur-pick">
        <option value="pet_ur05">永眠花皇兔（月亮）</option>
        <option value="pet_ur06" selected>曙綻花后兔（花瓣）</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="meet">相遇</label>
      <select id="meet">
        <option value="new">初次相遇</option>
        <option value="dup">再次相遇</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="speed">速度</label>
      <select id="speed">
        <option value="full">完整動畫</option>
        <option value="fast">快速（略過儀式）</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="reduced">Reduced Motion</label>
      <select id="reduced">
        <option value="off">關閉</option>
        <option value="on">啟用</option>
      </select>
    </div>
    <button type="button" id="btn-play">播放 mock 演出</button>

    <h2>V3.4.3 流程驗證案例</h2>
    <div class="btn-grid">
      <button type="button" data-case="skip-intro-keep-reveal">主動畫略過但保留 reveal queue</button>
      <button type="button" data-case="skip-reveal-queue">reveal queue 略過</button>
      <button type="button" data-case="single-ssr-19-20">19 → 20 單抽 SSR（mock 流程順序）</button>
      <button type="button" data-case="single-ur-19-20">19 → 20 單抽 UR（mock 流程順序）</button>
      <button type="button" data-case="ten-multi-ssrplus">15 → 25 十連多 SSR+（含重複 petId）</button>
      <button type="button" data-case="dup-petid-queue">重複相同 petId 的多張 SSR+</button>
      <button type="button" data-case="first-fail-next-ok">第一張圖片失敗、下一張正常</button>
      <button type="button" data-case="double-trigger">點擊與按鈕雙觸發（自動驗證）</button>
      <button type="button" data-case="cleanup-20-moon">連續播放永眠花皇兔 20 次 cleanup</button>
      <button type="button" data-case="cleanup-20-petal">連續播放曙綻花后兔 20 次 cleanup</button>
      <button type="button" data-case="cleanup-20-alt">兩者交替 20 次 cleanup</button>
    </div>

    <p id="status" aria-live="polite"></p>
    <pre id="log"></pre>
  </div>

  <script type="module">
    import { playDreamBloomSummon } from '../src/themedSummonController.js';
    import {
      playSsrPlusRevealQueue,
      playSummonReveal,
      collectSsrPlusRevealQueue,
      skipSummonReveal,
    } from '../src/summonRevealService.js';
    import { mergeAllPetsWithLore } from '../src/loreService.js';

    const RARITY_PET = {
      N: 'pet_n17',
      R: 'pet_r16',
      SR: 'pet_sr12',
      SSR: 'pet_ssr07',
      UR: 'pet_ur06',
    };

    const TEN_POOL = [
      'pet_n17', 'pet_n18', 'pet_r13', 'pet_r14', 'pet_sr09',
      'pet_sr10', 'pet_ssr05', 'pet_ssr06', 'pet_ur05', 'pet_n19',
    ];

    let petsById = new Map();
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');

    function log(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.textContent = `${line}\n${logEl.textContent}`.slice(0, 6000);
      console.log(line);
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
      log(msg);
    }

    async function loadPets() {
      const [petsRes, loreRes] = await Promise.all([
        fetch('../data/pets.json'),
        fetch('../data/pets-lore.json'),
      ]);
      const petsData = await petsRes.json();
      const loreData = loreRes.ok ? await loreRes.json() : { lore: [] };
      const merged = mergeAllPetsWithLore(petsData.pets || [], loreData);
      petsById = new Map(merged.map((p) => [p.id, p]));
    }

    function resolveForcePet(rarity) {
      if (rarity === 'UR') {
        return petsById.get(document.getElementById('ur-pick').value);
      }
      return petsById.get(RARITY_PET[rarity]);
    }

    function mockItem(pet, { isNew = true } = {}) {
      const rarity = pet?.rarity || 'N';
      const frags = { N: 1, R: 2, SR: 5, SSR: 10, UR: 20 };
      return {
        pet,
        rarity,
        isNew,
        fragmentsGained: isNew ? 0 : (frags[rarity] || 1),
        duplicateFragments: isNew ? 0 : (frags[rarity] || 1),
      };
    }

    function buildMockResults() {
      const mode = document.getElementById('mode').value;
      const rarity = document.getElementById('rarity').value;
      const isNew = document.getElementById('meet').value === 'new';

      if (mode === 'single') {
        return [mockItem(resolveForcePet(rarity), { isNew })];
      }

      return TEN_POOL.map((id, index) => {
        let pet = petsById.get(id);
        if (index === 2 && (rarity === 'SSR' || rarity === 'UR')) {
          pet = petsById.get('pet_ssr07') || pet;
        }
        if (index === 7 && rarity === 'UR') {
          pet = resolveForcePet('UR');
        } else if (index === 6) {
          pet = resolveForcePet(rarity) || pet;
        }
        const fresh = isNew && (index === 6 || index === 7 || index === 2);
        return mockItem(pet, { isNew: fresh });
      });
    }

    function countDomResidue() {
      return {
        overlays: document.querySelectorAll('.summon-reveal-overlay').length,
        moons: document.querySelectorAll('.summon-reveal-moon').length,
        petals: document.querySelectorAll('.summon-reveal-fall-petal').length,
        dreamOverlays: document.querySelectorAll('.dream-bloom-overlay').length,
        scrollLock: document.body.classList.contains('summon-reveal-active')
          || document.body.classList.contains('themed-summon-active'),
      };
    }

    async function playWithSkipIntroKeepReveal() {
      const ur = petsById.get(document.getElementById('ur-pick').value);
      const results = [mockItem(ur)];
      setStatus('播放中：略過前置儀式，應仍進入 UR reveal…');
      // skipRitual=true 模擬主動畫略過；queue 必須仍播放
      await playDreamBloomSummon({
        results,
        mode: 'single',
        reduceMotion: document.getElementById('reduced').value === 'on',
        skipRitual: true,
      });
      setStatus('完成：主動畫略過後仍播放 reveal（請人工確認曾見到角色出場）。');
    }

    async function playSkipRevealQueue() {
      const ssr = petsById.get('pet_ssr07');
      const ur = petsById.get('pet_ur06');
      const results = [mockItem(ssr), mockItem(ssr), mockItem(ur)];
      setStatus('播放 queue；0.6s 後自動略過剩餘 reveal…');
      const p = playSsrPlusRevealQueue({ results, reduceMotion: false });
      setTimeout(() => {
        skipSummonReveal();
        log('已呼叫 skipSummonReveal()');
      }, 600);
      const outcome = await p;
      setStatus(`queue 略過結果：played=${outcome.played}, skipped=${outcome.skipped}`);
    }

    async function play19to20(kind) {
      const pet = kind === 'UR'
        ? petsById.get(document.getElementById('ur-pick').value)
        : petsById.get('pet_ssr07');
      const results = [mockItem(pet)];
      setStatus(`mock 19→20 單抽 ${kind}：主動畫→reveal→結果（不寫入資料）`);
      await playDreamBloomSummon({ results, mode: 'single', reduceMotion: false });
      setStatus(`順序驗證提示：結果關閉後才應播晨醒（本預覽不含晨醒寫入）。${kind} reveal 已跑完。`);
    }

    async function playTenMulti() {
      // index1=SSR, index4=同 SSR, index8=UR —— 三張皆須播放
      const ssr = petsById.get('pet_ssr07');
      const ur = petsById.get('pet_ur06');
      const ids = [
        'pet_n17', 'pet_ssr07', 'pet_n18', 'pet_r13', 'pet_ssr07',
        'pet_r14', 'pet_sr09', 'pet_sr10', 'pet_ur06', 'pet_n19',
      ];
      const results = ids.map((id, i) => {
        if (i === 1 || i === 4) return mockItem(ssr, { isNew: i === 1 });
        if (i === 8) return mockItem(ur);
        return mockItem(petsById.get(id), { isNew: false });
      });
      const queue = collectSsrPlusRevealQueue(results);
      log(`queue length=${queue.length} petIds=${queue.map((q) => q.petId).join(',')}`);
      if (queue.length !== 3) {
        setStatus(`FAIL：應為 3 張 SSR+，實際 ${queue.length}`);
        return;
      }
      setStatus('十連多 SSR+（含重複 petId）播放中…');
      await playDreamBloomSummon({ results, mode: 'ten', reduceMotion: false, skipRitual: true });
      setStatus('完成：應已依序播放 SSR→SSR→UR（無 petId 去重）。');
    }

    async function playDupPetId() {
      const ssr = petsById.get('pet_ssr05');
      const results = [
        mockItem(petsById.get('pet_n17')),
        mockItem(ssr),
        mockItem(petsById.get('pet_r13')),
        mockItem(petsById.get('pet_r14')),
        mockItem(ssr, { isNew: false }),
        mockItem(petsById.get('pet_sr09')),
        mockItem(petsById.get('pet_sr10')),
        mockItem(petsById.get('pet_n18')),
        mockItem(petsById.get('pet_ur05')),
        mockItem(petsById.get('pet_n19')),
      ];
      const queue = collectSsrPlusRevealQueue(results);
      log(`dup queue=${queue.map((q) => `${q.index}:${q.petId}`).join(' | ')}`);
      const outcome = await playSsrPlusRevealQueue({ results, reduceMotion: false });
      setStatus(`重複 petId queue：played=${outcome.played}（期望 3）`);
    }

    async function playFirstFailNextOk() {
      const ssr = { ...petsById.get('pet_ssr07'), image: 'assets/pets/__missing_force_fail__.png' };
      const ur = petsById.get('pet_ur06');
      const results = [mockItem(ssr), mockItem(ur)];
      setStatus('第一張強制 fallback，第二張應正常…');
      const outcome = await playSsrPlusRevealQueue({
        results,
        reduceMotion: false,
        forceFirstFallback: true,
      });
      setStatus(`fallback queue：played=${outcome.played}, failed=${outcome.failed}`);
    }

    async function playDoubleTrigger() {
      const pet = petsById.get('pet_ssr07');
      setStatus('雙觸發測試：就緒後同時點擊畫面與按鈕…');
      let advanceCount = 0;
      const orig = HTMLElement.prototype.click;
      // 透過實際播放，手動在 console 提示；此處用程式模擬就緒後雙呼叫
      const p = playSummonReveal({ rarity: 'SSR', pet, mode: 'debug', reduceMotion: true });
      await new Promise((r) => setTimeout(r, 700));
      const overlay = document.querySelector('.summon-reveal-overlay');
      const btn = overlay?.querySelector('.summon-reveal-skip');
      if (!overlay || !btn) {
        setStatus('FAIL：找不到 overlay／按鈕');
        return;
      }
      // 模擬同時觸發
      btn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      overlay.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      overlay.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await p;
      const residue = countDomResidue();
      setStatus(`雙觸發結束；殘留 overlays=${residue.overlays}（期望 0）。若只關一次即 PASS。`);
      void advanceCount;
      void orig;
    }

    async function cleanupLoopAuto(ids, times) {
      const startNodes = document.querySelectorAll('*').length;
      for (let i = 0; i < times; i += 1) {
        const id = ids[i % ids.length];
        const pet = petsById.get(id);
        setStatus(`cleanup ${i + 1}/${times}：${pet?.name || id}`);
        const p = playSummonReveal({
          rarity: pet.rarity,
          pet,
          mode: 'debug',
          reduceMotion: true,
        });
        // 等 overlay 掛上再略過，避免竞態
        for (let t = 0; t < 40; t += 1) {
          if (document.querySelector('.summon-reveal-overlay')) break;
          await new Promise((r) => setTimeout(r, 25));
        }
        skipSummonReveal();
        await p;
      }
      const after = countDomResidue();
      const endNodes = document.querySelectorAll('*').length;
      const ok = after.overlays === 0 && after.moons === 0 && after.petals === 0 && !after.scrollLock;
      setStatus(`${ok ? 'PASS' : 'FAIL'} cleanup：overlays=${after.overlays}, moons=${after.moons}, petals=${after.petals}, scrollLock=${after.scrollLock}, Δnodes=${endNodes - startNodes}`);
    }

    document.getElementById('btn-play').addEventListener('click', async () => {
      setStatus('播放中…（未呼叫正式抽卡）');
      try {
        const results = buildMockResults();
        const reduceMotion = document.getElementById('reduced').value === 'on';
        if (document.getElementById('theme').value === 'ssrplus_only') {
          const outcome = await playSsrPlusRevealQueue({ results, reduceMotion });
          setStatus(`SSR+ queue 結束（played=${outcome.played}, skipped=${outcome.skipped}）。未扣星塵。`);
          return;
        }
        await playDreamBloomSummon({
          results,
          mode: document.getElementById('mode').value,
          reduceMotion,
          skipRitual: document.getElementById('speed').value === 'fast',
        });
        setStatus('演出結束。未扣星塵、未寫入收藏／保底。');
      } catch (err) {
        setStatus(`錯誤：${err?.message || err}`);
      }
    });

    document.querySelectorAll('[data-case]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const key = btn.getAttribute('data-case');
        try {
          if (key === 'skip-intro-keep-reveal') await playWithSkipIntroKeepReveal();
          else if (key === 'skip-reveal-queue') await playSkipRevealQueue();
          else if (key === 'single-ssr-19-20') await play19to20('SSR');
          else if (key === 'single-ur-19-20') await play19to20('UR');
          else if (key === 'ten-multi-ssrplus') await playTenMulti();
          else if (key === 'dup-petid-queue') await playDupPetId();
          else if (key === 'first-fail-next-ok') await playFirstFailNextOk();
          else if (key === 'double-trigger') await playDoubleTrigger();
          else if (key === 'cleanup-20-moon') await cleanupLoopAuto(['pet_ur05'], 20);
          else if (key === 'cleanup-20-petal') await cleanupLoopAuto(['pet_ur06'], 20);
          else if (key === 'cleanup-20-alt') await cleanupLoopAuto(['pet_ur05', 'pet_ur06'], 20);
        } catch (err) {
          setStatus(`案例錯誤：${err?.message || err}`);
        }
      });
    });

    loadPets().then(() => {
      setStatus('寵物資料已載入，可播放。');
    }).catch((err) => {
      setStatus(`載入失敗：${err?.message || err}`);
    });
  </script>
</body>
</html>
