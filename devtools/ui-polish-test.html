<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuestNote UI polish validation</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #111827; color: #f8fafc; font: 15px/1.5 system-ui; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { max-width: 850px; }
  button, select { padding: 9px 12px; border: 1px solid #94a3b8; border-radius: 8px; background: #24324b; color: inherit; font: inherit; }
  button { cursor: pointer; } button:disabled { opacity: .45; cursor: default; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .workspace { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  iframe { box-sizing: content-box; width: 390px; height: 844px; border: 1px solid #94a3b8; background: #080b16; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; flex: 1; min-width: 300px; max-width: 780px; margin: 0; }
</style>
<h1>UI polish · 390 × 844</h1>
<p>專用 localhost 新 origin，只建立合成測試資料，不刪除既存資料。必須以 <code>node devtools/ui-polish-server.mjs</code> 啟動。每次重啟伺服器請使用新的 port；同一伺服器、同一分頁可重跑。</p>
<p>先初始化，再選 VP 檢查。檢查使用真實 app、服務 API、DOM 與 computed styles；Tab 檢查只驗證邊界事件處理，實際鍵盤循環、触控、safe-area、視覺品質仍須人工確認。VP-03 不在範圍內。</p>
<div class="controls"><button id="initialize">安全檢查並初始化測試資料</button><button id="reload" disabled>重新載入 App</button><select id="theme" disabled aria-label="主題"><option value="default">Default</option><option value="sweet">Sweet</option></select></div>
<div class="controls"><button data-view="tasks" disabled>任務</button><button data-view="collection" disabled>圖鑑</button><button data-view="settings" disabled>設定</button><select id="group" aria-label="檢查組"><option>VP-01</option><option>VP-02</option><option>VP-04</option><option>VP-05</option></select><button id="run" disabled>執行目前 VP 檢查（兩主題）</button></div>
<div class="workspace"><iframe id="preview" title="QuestNote 390 × 844 測試畫面" src="about:blank"></iframe><pre id="results" aria-live="polite">尚未初始化；不會在安全檢查前開啟 App 或匯入資料服務。</pre></div>
<script type="module" src="./ui-polish-test.js"></script>
</html>
