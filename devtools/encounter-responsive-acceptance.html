<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Encounter responsive acceptance</title>
<style>body{margin:0}iframe{display:block;width:100%;height:852px;border:0}button{min-height:44px}</style>
<button id="normal">標準字級</button><button id="large">200% 字級</button><iframe id="app" title="隔離完整 App" src="../index.html"></iframe>
<script type="module">
if(location.hostname!=='127.0.0.1'||location.port!=='4194')throw new Error('Isolated test origin required');
const app=document.getElementById('app');
document.getElementById('normal').onclick=()=>{app.contentDocument.documentElement.style.fontSize='';};
document.getElementById('large').onclick=()=>{app.contentDocument.documentElement.style.fontSize='32px';};
</script></html>
