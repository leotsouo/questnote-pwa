<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>永眠花海入場動畫預覽（Dev）</title>
  <link rel="stylesheet" href="../src/styles.css">
  <style>
    body {
      margin: 0;
      padding: max(1rem, env(safe-area-inset-top)) 1rem 2rem;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: #0b1020;
      color: #e8eef8;
    }
    .preview-panel {
      max-width: 36rem;
      margin: 0 auto;
      display: grid;
      gap: 0.75rem;
    }
    .preview-panel h1 { font-size: 1.15rem; margin: 0; }
    .preview-panel p { margin: 0; color: #a8b4cc; font-size: 0.85rem; }
    .preview-row {
      display: grid;
      grid-template-columns: 8.5rem 1fr;
      gap: 0.5rem;
      align-items: center;
    }
    select, button {
      padding: 0.45rem 0.65rem;
      border-radius: 0.45rem;
      border: 1px solid rgba(180, 200, 230, 0.28);
      background: #161e32;
      color: inherit;
    }
    button { cursor: pointer; background: #24304a; }
    .warn {
      padding: 0.65rem 0.75rem;
      border-radius: 0.55rem;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.3);
      font-size: 0.8rem;
      color: #fbbf24;
    }
    .mock-gacha {
      margin-top: 0.5rem;
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(180, 200, 230, 0.2);
      background:
        radial-gradient(ellipse at 70% 10%, rgba(107, 91, 149, 0.28), transparent 45%),
        linear-gradient(165deg, #10182e, #1a2038 55%, #121826);
      min-height: 12rem;
    }
    .mock-gacha h2 { margin: 0 0 0.35rem; font-size: 1.05rem; }
    .mock-gacha p { margin: 0; color: #c4d0e6; font-size: 0.82rem; }
    .mock-actions { display: flex; gap: 0.5rem; margin-top: 0.85rem; flex-wrap: wrap; }
    .mock-actions button { min-width: 5.5rem; }
    .log {
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 0.5rem;
      padding: 0.65rem;
      min-height: 4rem;
    }
  </style>
</head>
<body>
  <div class="preview-panel">
    <h1>永眠花海入場動畫預覽（開發用）</h1>
    <p>不寫入 IndexedDB／poolDebutSeen、不抽卡、不改正式資料。可重複預覽與略過。</p>
    <div class="warn">此頁不屬於正式 App 導航，請勿加入 Service Worker precache。</div>

    <div class="preview-row">
      <label for="mode">模式</label>
      <select id="mode">
        <option value="full" selected>完整入場（首次）</option>
        <option value="short">短轉場（已看過切換）</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="motion">Reduced Motion</label>
      <select id="motion">
        <option value="false" selected>正常</option>
        <option value="true">開啟</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="theme">主題</label>
      <select id="theme">
        <option value="default" selected>default</option>
        <option value="sweet">Sweet</option>
      </select>
    </div>
    <div class="preview-row">
      <label for="width">預覽寬度</label>
      <select id="width">
        <option value="auto" selected>目前視窗</option>
        <option value="320">320px</option>
        <option value="375">375px</option>
        <option value="390">390px</option>
        <option value="430">430px</option>
      </select>
    </div>

    <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
      <button type="button" id="btn-play">播放入場動畫</button>
      <button type="button" id="btn-burst">連續預覽 20 次</button>
      <button type="button" id="btn-clear-log">清除日誌</button>
    </div>

    <div id="gacha-panel" class="mock-gacha gacha-panel" data-pool-theme="eternal_slumber_bloom" data-pool-phase="slumber">
      <h2>永眠花海（主畫面 mock）</h2>
      <p>動畫結束後此區應可點、無殘留遮罩／模糊。</p>
      <div class="mock-actions">
        <button type="button" id="btn-single">單抽</button>
        <button type="button" id="btn-ten">十連</button>
        <button type="button" id="btn-details">詳情</button>
      </div>
    </div>

    <div class="log" id="log" aria-live="polite"></div>
  </div>

  <script type="module">
    import { playPoolDebutPresentation } from '../src/themedSummonController.js';
    import { normalizePoolDefinition } from '../src/poolContentContract.js';
    const poolReady = fetch('../data/pools.json').then((response) => response.json()).then((data) => normalizePoolDefinition(data.pools.find((pool) => pool.presentation)));

    const logEl = document.getElementById('log');
    const panel = document.getElementById('gacha-panel');
    let playing = false;
    let runCount = 0;

    function log(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.textContent = `${line}\n${logEl.textContent}`.slice(0, 4000);
    }

    function applyTheme() {
      const theme = document.getElementById('theme').value;
      if (theme === 'sweet') document.body.dataset.theme = 'sweet';
      else delete document.body.dataset.theme;
    }

    function applyWidth() {
      const w = document.getElementById('width').value;
      if (w === 'auto') {
        panel.style.maxWidth = '';
        panel.style.marginInline = '';
      } else {
        panel.style.maxWidth = `${w}px`;
        panel.style.marginInline = 'auto';
      }
    }

    async function playOnce(label = 'play') {
      if (playing) {
        log('略過：上一段仍在播放');
        return;
      }
      playing = true;
      applyTheme();
      applyWidth();
      const full = document.getElementById('mode').value === 'full';
      const reduceMotion = document.getElementById('motion').value === 'true';
      const t0 = performance.now();
      const beforeNodes = document.querySelectorAll('.dream-debut-overlay').length;
      try {
        log(`${label} 開始 full=${full} reduce=${reduceMotion}`);
        const pool = await poolReady;
        await playPoolDebutPresentation({ full, reduceMotion, poolName: pool.name, presentation: pool.presentation });
        const afterNodes = document.querySelectorAll('.dream-debut-overlay').length;
        const veil = panel.classList.contains('is-pool-debut-veil');
        const reveal = panel.classList.contains('is-pool-debut-reveal');
        const locked = document.body.classList.contains('themed-summon-active');
        runCount += 1;
        log(
          `${label} 完成 ${Math.round(performance.now() - t0)}ms | overlays ${beforeNodes}→${afterNodes} | veil=${veil} reveal=${reveal} lock=${locked} | n=${runCount}`
        );
      } catch (err) {
        log(`${label} 失敗: ${err?.message || err}`);
      } finally {
        playing = false;
      }
    }

    document.getElementById('btn-play').addEventListener('click', () => playOnce('preview'));
    document.getElementById('btn-burst').addEventListener('click', async () => {
      for (let i = 1; i <= 20; i += 1) {
        await playOnce(`burst#${i}`);
      }
      const leftover = document.querySelectorAll('.dream-debut-overlay').length;
      log(`連續 20 次結束，殘留 overlay=${leftover} body.lock=${document.body.classList.contains('themed-summon-active')}`);
    });
    document.getElementById('btn-clear-log').addEventListener('click', () => {
      logEl.textContent = '';
    });
    document.getElementById('theme').addEventListener('change', applyTheme);
    document.getElementById('width').addEventListener('change', applyWidth);
    ['btn-single', 'btn-ten', 'btn-details'].forEach((id) => {
      document.getElementById(id).addEventListener('click', () => log(`主畫面按鈕可用：${id}`));
    });

    applyTheme();
    log('就緒。可播放／略過／Esc／連續 20 次。');
  </script>
</body>
</html>
