<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>劍隱山河 · 覺醒演出檢視</title><link rel="stylesheet" href="src/pet-awakening.css"><style>
body{margin:0;background:#122527;color:#f3ead2;font:16px/1.8 system-ui,sans-serif}main{max-width:1140px;margin:auto;padding:32px 20px}h1{font:36px/1.5 serif;margin:.3em 0}.intro{max-width:800px;color:#d4d8c8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}article{background:#1e3738;border:1px solid #53645b;border-radius:20px;overflow:hidden}.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px}.pair img{width:100%;display:block}.body{padding:18px}.body h2{margin:0}.body p{font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:10px 16px;border:1px solid #bda26b;border-radius:9px;background:#284447;color:#fff0cf;cursor:pointer;min-height:44px}button:disabled{opacity:.5}.tag{color:#e5c486}.status{overflow-wrap:anywhere;font-size:13px}.awakening-scene .btn{font:inherit}
</style></head><body><main><p class="tag">劍隱山河 · 覺醒篇章</p><h1>守諾之後，與你同行</h1><p class="intro">初遇／覺醒並排；鎮嶺蛤採新張口朱息造型，正式第三版仍保留於未覺醒與抽卡。播放使用實際覺醒模組，只展示演出，不取得角色、不消耗素材、不寫入存檔。UR 約五秒，其餘約三秒；皆可略過、重播，減少動態約0.6秒。</p><p id="artifact" class="status"></p><div id="grid" class="grid"></div><section id="map-review" style="margin-top:36px"><h2>雲棧古道 · 新舊地圖</h2><p>新圖960×540；地區身份、能量、時間、獎勵及五個里程碑不變。舊SVG保留。</p><figure style="margin:0"><img src="assets/expeditions/cloudrest_trail.webp" alt="雲棧古道新地圖：竹林石階、暖燈山亭、棧橋與霧中群山" style="display:block;width:100%;max-width:960px;aspect-ratio:16/9"><figcaption>新場景插畫 · 960×540</figcaption></figure><details><summary>比較原簡化SVG與既有地區畫風</summary><img src="assets/expeditions/cloudrest_trail.svg" alt="保留的舊SVG" style="width:100%;max-width:960px"><div class="pair"><img src="assets/expeditions/mist_forest.webp" alt="迷霧森林參考"><img src="assets/expeditions/harvest_fields.webp" alt="豐穗遠郊參考"></div></details></section><p id="status" role="status" aria-live="polite"></p></main><script type="module">
import { loadAwakeningCatalog } from './src/petAwakeningCatalog.js';
import { loadCatalogBundle } from './src/releaseCatalog.js';
import { RELEASE_PROFILE } from './src/releaseProfile.js';
import { playAwakeningScene } from './src/petAwakeningScene.js';
const [catalog, bundle] = await Promise.all([loadAwakeningCatalog(), loadCatalogBundle()]);
document.querySelector('#artifact').textContent = RELEASE_PROFILE ? `不可變預覽 artifact：${RELEASE_PROFILE.artifactId}` : '來源原型預覽；最終驗收會改用不可變發布包。';
for (const entry of [...catalog.pets].sort((a, b) => (a.rarity === 'UR' ? 0 : 1) - (b.rarity === 'UR' ? 0 : 1))) {
  const pet = bundle.petsData.pets.find((p) => p.id === entry.petId);
  const card = document.createElement('article');
  card.innerHTML = `<div class="pair"><img src="${entry.initialImage.card}" alt="${entry.name}初遇相"><img src="${entry.awakenedImage?.card || pet.imageVariants.card}" alt="${entry.name}覺醒相"></div><div class="body"><span class="tag">${entry.rarity} · 初遇／覺醒</span><h2>${entry.name}</h2><p>${entry.signature}</p><p>信物：${entry.tokenName}<br>稱號：${entry.title}</p><p><a style="color:#f2d891" href="${entry.initialImage.original}" target="_blank" rel="noopener">初遇原尺寸</a> · <a style="color:#f2d891" href="${entry.awakenedImage?.original || pet.image}" target="_blank" rel="noopener">覺醒原尺寸</a></p><div class="actions"><button data-play="normal">播放覺醒</button><button data-play="reduced">減少動態</button></div>${entry.awakenedImage ? `<details><summary>比較保留的正式第三版</summary><img src="${pet.imageVariants.card}" alt="${entry.name}正式第三版" style="width:100%"><p>正式第三版保留用於未覺醒角色與抽卡，新圖於覺醒後開放。</p></details>` : ''}<details><summary>覺醒故事與陪伴回應</summary>${entry.story.map((p) => `<p>${p}</p>`).join('')}<p>${entry.dialogue.join('<br>')}</p></details></div>`;
  for (const button of card.querySelectorAll('[data-play]')) button.addEventListener('click', async () => {
    for (const b of document.querySelectorAll('[data-play]')) b.disabled = true;
    try { await playAwakeningScene(entry, pet, { reducedMotion: button.dataset.play === 'reduced' }); document.querySelector('#status').textContent = `${entry.name}演出結束，可再次播放。`; }
    finally { for (const b of document.querySelectorAll('[data-play]')) b.disabled = false; }
  });
  document.querySelector('#grid').append(card);
}
</script></body></html>
