name: Marketing website
on:
  pull_request:
    paths: ['marketing/**', '.github/workflows/marketing.yml']
  push:
    branches: ['codex/questnote-marketing', 'main']
    paths: ['marketing/**', '.github/workflows/marketing.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the tested static build to the QuestNote Pages project'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  marketing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real browser QA
        env:
          QA_BROWSER_CHANNEL: chromium
        run: |
          npm run dev > /tmp/questnote-marketing-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8031/ > /dev/null && break || sleep 1; done
          npm run qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-static-build-and-qa
          path: |
            marketing/dist
            reports/marketing/local
      - name: Optional Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.QUESTNOTE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set QUESTNOTE_PAGES_API_TOKEN before requesting deployment.'; exit 1; }
          npx wrangler@4.141.0 pages deploy dist --project-name questnote-marketing --branch "${GITHUB_REF_NAME}" --commit-hash "$GITHUB_SHA" --commit-dirty=false
