name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Cache recovery tests execute the real historical aada9a7 worker.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Same gate as `npm run check` locally: lint (undefined names, duplicate keys), parse every
      # runtime file, unit/flow tests, catalog and image validation.
      - run: npm run lint
      - run: node devtools/syntax-check.mjs
      - run: npm test
      - run: npm run pools:validate
      - run: npm run images:check
