name: iOS

# Push to dev: compile for the simulator without signing, to catch native errors quickly.
# Manual run with "upload": sign with the App Store Connect API key and upload to TestFlight.
on:
  push:
    branches: [dev]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'index.html'
      - 'capacitor.config.json'
      - 'package-lock.json'
      - 'scripts/build-ios-web.mjs'
      - 'scripts/releaseArtifact.mjs'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign and upload to TestFlight'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: xcodebuild -version
      # The same verified artifact pipeline as the PWA, with the bundled `ios` profile.
      - run: npm run ios:web
      - run: npx cap sync ios

      - name: Build for the simulator (no signing)
        if: env.UPLOAD != 'true'
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Archive and upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          VERSION=$(node -p "require('fs').readFileSync('src/version.js','utf8').match(/APP_VERSION = '([^']+)'/)[1]")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM=N5QFL8LN64 MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          echo "Uploaded QuestNote $VERSION (${{ github.run_number }}) to App Store Connect." >> "$GITHUB_STEP_SUMMARY"
